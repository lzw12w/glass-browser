name: Feature request
description: Propose a new capability or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today, or what is painful?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: >
        Sketch of how it could work. Note we bias toward a small tool surface
        and zero new runtime dependencies — see CONTRIBUTING.md.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
